[package]
name = "mp-library"
description = "Music library: folder scanning, tag reading, SQLite storage, playlists and folder watching"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mp-core.workspace = true
log.workspace = true
thiserror.workspace = true
lofty = "0.25"
notify = "8"
rayon = "1"
# `fallible_uint` lets u64 sizes and durations be stored and read without casts.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
walkdir = "2"

[dev-dependencies]
tempfile.workspace = true
