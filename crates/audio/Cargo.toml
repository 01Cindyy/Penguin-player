[package]
name = "mp-audio"
description = "Gapless playback engine: Symphonia decoding into a cpal output stream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["opus"]
opus = ["dep:opus"]

[dependencies]
mp-core.workspace = true
async-channel.workspace = true
log.workspace = true
thiserror.workspace = true
cpal = "0.18"
opus = { version = "0.4", optional = true }
# Already used by rubato; the visualiser's spectrum uses it directly.
realfft = "3"
rtrb = "0.4"
rubato = "5"
symphonia = { version = "0.6", features = ["all", "opt-simd"] }

[dev-dependencies]
tempfile.workspace = true
