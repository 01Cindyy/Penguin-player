[package]
name = "penguin-player"
description = "GTK4 / libadwaita front end"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "penguin_player"
path = "src/lib.rs"

[[bin]]
name = "penguin-player"
path = "src/main.rs"

[dependencies]
mp-core.workspace = true
mp-audio.workspace = true
mp-library.workspace = true
mp-plugins.workspace = true
mp-theme.workspace = true
async-channel.workspace = true
log.workspace = true
env_logger = "0.11"
serde_json.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }

# OS media controls: MPRIS over D-Bus on Linux/BSD, Now Playing on macOS.
# Windows needs a native window handle, so it is left out for now.
[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
souvlaki = "0.8"

# Quitting cleanly on SIGTERM and friends (see `src/signals.rs`).
# Blur behind translucent windows on KDE Plasma (KWin's Wayland blur protocol).
[target.'cfg(target_os = "linux")'.dependencies]
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[target.'cfg(unix)'.dependencies]
glib-unix = "0.22"
libc = "0.2"

[build-dependencies]
# Compiles the bundled icons into a GResource in pure Rust (no glib-compile-resources).
gvdb = { version = "0.9", features = ["gresource"] }

[dev-dependencies]
tempfile.workspace = true
